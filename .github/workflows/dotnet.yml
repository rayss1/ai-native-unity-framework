name: .NET 10 product validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable CI-only credentials; never a connection to a shared deployment.
    env:
      AINATIVE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=ainative_ci;Username=ainative_ci;Password=ci-only-disposable;Pooling=false
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: ainative_ci
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: ainative_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ainative_ci -d ainative_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify submodule state
        shell: bash
        run: |
          status="$(git submodule status --recursive)"
          printf '%s\n' "$status"
          if printf '%s\n' "$status" | grep -Eq '^[-+U]'; then
            echo "Submodule is uninitialized, conflicted, or differs from the recorded gitlink." >&2
            exit 1
          fi

      - name: Validate release qualification contract
        shell: bash
        run: |
          bash -n tools/release/verify-battle-host-qualification.sh
          bash -n tools/release/test-battle-host-qualification.sh
          tools/release/test-battle-host-qualification.sh
          bash -n tools/release/verify-battle-host-release.sh
          bash -n tools/release/resolve-battle-host-release.sh
          bash -n tools/release/test-battle-host-release.sh
          tools/release/test-battle-host-release.sh
          bash -n tools/release/verify-telemetry-capacity.sh
          bash -n tools/release/test-telemetry-capacity.sh
          tools/release/test-telemetry-capacity.sh
          bash -n tools/release/verify-multi-room-capacity.sh
          bash -n tools/release/test-multi-room-capacity.sh
          tools/release/test-multi-room-capacity.sh

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.202

      - name: Restore
        run: dotnet restore AiNative.sln

      - name: Verify generated protocol artifacts
        run: |
          dotnet build tools/ProtocolCodegen/ProtocolCodegen.csproj --configuration Release --no-restore -p:GenerateProtocol=true
          git diff --exit-code -- shared/generated/csharp

      - name: Build
        run: dotnet build AiNative.sln --configuration Release --no-restore

      - name: Test .NET 10
        run: dotnet test AiNative.sln --configuration Release --no-build --no-restore

      - name: Test PostgreSQL report gate
        run: python3 -m unittest discover -s tools/validation/tests -p test_postgres_gate.py -v

      - name: Run real Player persistence tests
        run: >-
          dotnet test server/tests/AiNative.Server.Backend.Tests/AiNative.Server.Backend.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter FullyQualifiedName~AiNative.Server.Backend.Tests.PostgresTests
          --logger "trx;LogFileName=player.trx"
          --results-directory artifacts/postgres-tests

      - name: Run real Coordinator persistence tests
        run: >-
          dotnet test server/tests/AiNative.Server.Rooms.Tests/AiNative.Server.Rooms.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter FullyQualifiedName~AiNative.Server.Rooms.Tests.PostgresAllocationStoreTests
          --logger "trx;LogFileName=coordinator.trx"
          --results-directory artifacts/postgres-tests

      - name: Require all named PostgreSQL cases to pass
        if: always()
        run: python3 tools/validation/verify-postgres-tests.py artifacts/postgres-tests

      - name: Retain PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-postgres-tests
          path: artifacts/postgres-tests
          if-no-files-found: error

      - name: Publish Battle Host
        run: |
          dotnet publish server/src/Hosts/AiNative.BattleHost/AiNative.BattleHost.csproj \
            --configuration Release \
            --framework net10.0 \
            --no-restore \
            --output artifacts/product/battle-host \
            --nologo
          test "$(find artifacts/product/battle-host -name Fantasy.config -type f | wc -l)" = '1'
          test -f artifacts/product/battle-host/Fantasy-Net.dll
          grep -q 'Fantasy-Net/2026.1.1004-ainative.1' artifacts/product/battle-host/AiNative.BattleHost.deps.json
          test "$(jq -r '.runtimeOptions.tfm' artifacts/product/battle-host/AiNative.BattleHost.runtimeconfig.json)" = 'net10.0'

      - name: Audit dependencies
        run: |
          output="$(dotnet package list --project AiNative.sln --vulnerable --include-transitive --no-restore --format json --output-version 1)"
          test "$(jq '[.. | objects | .vulnerabilities? // empty | length] | add // 0' <<<"$output")" = '0'

      - name: Validate architecture
        run: dotnet run --project tools/ArchitectureCheck --configuration Release --no-build -- --root . --format text
