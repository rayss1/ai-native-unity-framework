name: Runtime acceptance candidate

on:
  pull_request:
    paths:
      - .github/workflows/runtime-acceptance.yml
      - server/RuntimeAcceptance.sln
      - server/src/**
      - server/tests/**
      - shared/gameplay/**
      - shared/protocol/**
      - shared/realtime/**
      - server/vendor/Fantasy

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact submodule state
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.202

      - name: Restore candidate
        run: dotnet restore server/RuntimeAcceptance.sln

      - name: Build candidate
        run: dotnet build server/RuntimeAcceptance.sln --configuration Release --no-restore --warnaserror

      - name: Run adapter, health, and allocation tests
        run: dotnet test server/RuntimeAcceptance.sln --configuration Release --no-build --no-restore

      - name: Publish candidate Host
        run: >-
          dotnet publish server/src/Hosts/AiNative.BattleHost/AiNative.BattleHost.csproj
          --configuration Release
          --framework net10.0
          --no-restore
          --output artifacts/battle-host
          --nologo

      - name: Probe readiness, telemetry outage, drain, and SIGTERM
        shell: bash
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5080
          AINATIVE_ENABLE_EVALUATION_ENDPOINTS: "true"
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
        run: |
          set -euo pipefail
          stdout=artifacts/battle-host.stdout.log
          stderr=artifacts/battle-host.stderr.log
          dotnet artifacts/battle-host/AiNative.BattleHost.dll >"$stdout" 2>"$stderr" &
          host_pid=$!
          cleanup() { kill -KILL "$host_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          deadline=$((SECONDS + 30))
          until curl --fail --silent http://127.0.0.1:5080/health/ready >/dev/null; do
            if ! kill -0 "$host_pid" 2>/dev/null || (( SECONDS >= deadline )); then
              cat "$stdout" "$stderr"
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent --request POST http://127.0.0.1:5080/admin/drain >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5080/health/ready)" = '503'
          kill -TERM "$host_pid"
          shutdown_deadline=$((SECONDS + 10))
          while kill -0 "$host_pid" 2>/dev/null; do
            if (( SECONDS >= shutdown_deadline )); then
              cat "$stdout" "$stderr"
              exit 1
            fi
            sleep 0.1
          done
          wait "$host_pid"
          host_pid=''

      - name: Audit candidate dependencies
        run: |
          output="$(dotnet package list --project server/RuntimeAcceptance.sln --vulnerable --include-transitive --no-restore --format json --output-version 1)"
          test "$(jq '[.. | objects | .vulnerabilities? // empty | length] | add // 0' <<<"$output")" = '0'
