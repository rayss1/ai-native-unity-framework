name: Runtime acceptance candidate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/runtime-acceptance.yml
      - .dockerignore
      - Docs/ADR/0012-server-runtime-successor.md
      - Docs/Architecture/runtime-acceptance-candidate-2026-08-19.md
      - Docs/Architecture/technology-baseline.md
      - infrastructure/runtime-acceptance/**
      - server/RuntimeAcceptance.sln
      - server/acceptance/**
      - server/src/**
      - server/tests/**
      - shared/gameplay/**
      - shared/protocol/**
      - shared/realtime/**
      - server/vendor/Fantasy

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact submodule state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.202

      - name: Restore candidate
        working-directory: /tmp
        run: dotnet restore "$GITHUB_WORKSPACE/server/RuntimeAcceptance.sln"

      - name: Build candidate
        working-directory: /tmp
        run: dotnet build "$GITHUB_WORKSPACE/server/RuntimeAcceptance.sln" --configuration Release --no-restore --warnaserror

      - name: Run adapter, health, and allocation tests
        working-directory: /tmp
        run: dotnet test "$GITHUB_WORKSPACE/server/RuntimeAcceptance.sln" --configuration Release --no-build --no-restore

      - name: Run deterministic Regional, Degraded, and Backpressure profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/runtime-acceptance"
          export AINATIVE_SOURCE_COMMIT="$CANDIDATE_SOURCE_COMMIT"
          export AINATIVE_FANTASY_COMMIT="$(git -C "$GITHUB_WORKSPACE/server/vendor/Fantasy" rev-parse HEAD)"
          export AINATIVE_PROTOCOL_IDENTITY="$(sha256sum "$GITHUB_WORKSPACE/shared/schemas/ainative/v1/gameplay.proto" | cut -d ' ' -f 1)"
          runner="$GITHUB_WORKSPACE/artifacts/bin/AiNative.RuntimeAcceptance/Release/net10.0/AiNative.RuntimeAcceptance.dll"
          for profile in regional degraded backpressure; do
            dotnet "$runner" \
              --profile "$profile" \
              --warmup-ticks 600 \
              --measured-ticks 3600 \
              --seed 1592594996 \
              --output "$GITHUB_WORKSPACE/artifacts/runtime-acceptance/$profile.json"
          done

      - name: Publish candidate Host
        working-directory: /tmp
        run: >-
          dotnet publish "$GITHUB_WORKSPACE/server/src/Hosts/AiNative.BattleHost/AiNative.BattleHost.csproj"
          --configuration Release
          --framework net10.0
          --no-restore
          --output "$GITHUB_WORKSPACE/artifacts/battle-host"
          --nologo

      - name: Probe readiness, telemetry outage, drain, and SIGTERM
        shell: bash
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5080
          AINATIVE_ENABLE_EVALUATION_ENDPOINTS: "true"
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
        run: |
          set -euo pipefail
          export AINATIVE_SOURCE_COMMIT="$CANDIDATE_SOURCE_COMMIT"
          export AINATIVE_FANTASY_COMMIT="$(git -C "$GITHUB_WORKSPACE/server/vendor/Fantasy" rev-parse HEAD)"
          export AINATIVE_PROTOCOL_IDENTITY="$(sha256sum "$GITHUB_WORKSPACE/shared/schemas/ainative/v1/gameplay.proto" | cut -d ' ' -f 1)"
          export AINATIVE_REPLAY_CAPTURE_PATH="$GITHUB_WORKSPACE/artifacts/runtime-acceptance/direct-battle.anrp"
          test "$(find "$GITHUB_WORKSPACE/artifacts/battle-host" -name Fantasy.config -type f | wc -l)" = '1'
          test -f "$GITHUB_WORKSPACE/artifacts/battle-host/Fantasy-Net.dll"
          grep -q 'Fantasy-Net/2026.1.1002' "$GITHUB_WORKSPACE/artifacts/battle-host/AiNative.BattleHost.deps.json"
          stdout="$GITHUB_WORKSPACE/artifacts/battle-host.stdout.log"
          stderr="$GITHUB_WORKSPACE/artifacts/battle-host.stderr.log"
          dotnet "$GITHUB_WORKSPACE/artifacts/battle-host/AiNative.BattleHost.dll" -m Develop >"$stdout" 2>"$stderr" &
          host_pid=$!
          cleanup() { kill -KILL "$host_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          deadline=$((SECONDS + 30))
          until curl --fail --silent http://127.0.0.1:5080/health/ready >/dev/null; do
            if ! kill -0 "$host_pid" 2>/dev/null || (( SECONDS >= deadline )); then
              cat "$stdout" "$stderr"
              exit 1
            fi
            sleep 0.25
          done
          probe="$(curl --fail --silent --request POST http://127.0.0.1:5080/admin/kcp-loopback)"
          test "$(jq -r '.status' <<<"$probe")" = 'ok'
          test "$(jq -r '.reconnectedEpoch > .initialConnectionEpoch' <<<"$probe")" = 'true'
          curl --fail --silent --request POST http://127.0.0.1:5080/admin/drain >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5080/health/ready)" = '503'
          kill -TERM "$host_pid"
          shutdown_deadline=$((SECONDS + 10))
          while kill -0 "$host_pid" 2>/dev/null; do
            if (( SECONDS >= shutdown_deadline )); then
              cat "$stdout" "$stderr"
              exit 1
            fi
            sleep 0.1
          done
          wait "$host_pid"
          host_pid=''
          replay="$(dotnet "$GITHUB_WORKSPACE/artifacts/battle-host/AiNative.BattleHost.dll" --verify-replay "$AINATIVE_REPLAY_CAPTURE_PATH")"
          test "$(jq -r '.InputCount' <<<"$replay")" = '1'
          test "$(jq -r '.SourceCommit' <<<"$replay")" = "$CANDIDATE_SOURCE_COMMIT"
          test "$(jq -r '.FantasyCommit' <<<"$replay")" = "$AINATIVE_FANTASY_COMMIT"
          test "$(jq -r '.ProtocolIdentity' <<<"$replay")" = "$AINATIVE_PROTOCOL_IDENTITY"

          export AINATIVE_REPLAY_CAPTURE_PATH="$GITHUB_WORKSPACE/artifacts/runtime-acceptance/direct-load.anrp"
          export AINATIVE_ACCEPTANCE_REPORT_PATH="$GITHUB_WORKSPACE/artifacts/runtime-acceptance/direct-load-report.json"
          export AINATIVE_ACCEPTANCE_WARMUP_TICKS=60
          dotnet "$GITHUB_WORKSPACE/artifacts/battle-host/AiNative.BattleHost.dll" -m Develop >"$stdout" 2>"$stderr" &
          host_pid=$!
          deadline=$((SECONDS + 30))
          until curl --fail --silent http://127.0.0.1:5080/health/ready >/dev/null; do
            if ! kill -0 "$host_pid" 2>/dev/null || (( SECONDS >= deadline )); then
              cat "$stdout" "$stderr"
              exit 1
            fi
            sleep 0.25
          done
          load="$(curl --fail --silent --request POST 'http://127.0.0.1:5080/admin/kcp-load?botCount=64&durationSeconds=5')"
          test "$(jq -r '.botCount' <<<"$load")" = '64'
          test "$(jq -r '.peakConnections' <<<"$load")" = '64'
          test "$(jq -r '.inputFrames > 1000' <<<"$load")" = 'true'
          test "$(jq -r '.snapshotFrames > 0' <<<"$load")" = 'true'
          kill -TERM "$host_pid"
          shutdown_deadline=$((SECONDS + 10))
          while kill -0 "$host_pid" 2>/dev/null; do
            if (( SECONDS >= shutdown_deadline )); then
              cat "$stdout" "$stderr"
              exit 1
            fi
            sleep 0.1
          done
          wait "$host_pid"
          host_pid=''
          replay="$(dotnet "$GITHUB_WORKSPACE/artifacts/battle-host/AiNative.BattleHost.dll" --verify-replay "$AINATIVE_REPLAY_CAPTURE_PATH")"
          test "$(jq -r '.InputCount > 1000' <<<"$replay")" = 'true'
          test "$(jq -r '.gameplayAllocatedBytes' "$AINATIVE_ACCEPTANCE_REPORT_PATH")" = '0'
          test "$(jq -r '.tickP99Milliseconds <= 16.67' "$AINATIVE_ACCEPTANCE_REPORT_PATH")" = 'true'

      - name: Audit candidate dependencies
        working-directory: /tmp
        run: |
          output="$(dotnet package list --project "$GITHUB_WORKSPACE/server/RuntimeAcceptance.sln" --vulnerable --include-transitive --no-restore --format json --output-version 1)"
          test "$(jq '[.. | objects | .vulnerabilities? // empty | length] | add // 0' <<<"$output")" = '0'

      - name: Resolve immutable base image digests
        id: images
        shell: bash
        run: |
          set -euo pipefail
          sdk_tag='mcr.microsoft.com/dotnet/sdk:10.0.202-noble'
          runtime_tag='mcr.microsoft.com/dotnet/aspnet:10.0.4-noble'
          sdk_digest="$(docker buildx imagetools inspect "$sdk_tag" --format '{{.Manifest.Digest}}')"
          runtime_digest="$(docker buildx imagetools inspect "$runtime_tag" --format '{{.Manifest.Digest}}')"
          test "$sdk_digest" != '<no value>'
          test "$runtime_digest" != '<no value>'
          echo "sdk_image=$sdk_tag@$sdk_digest" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$runtime_tag@$runtime_digest" >> "$GITHUB_OUTPUT"

      - name: Build release-equivalent Linux x64 candidate
        shell: bash
        run: |
          set -euo pipefail
          fantasy_commit="$(git -C server/vendor/Fantasy rev-parse HEAD)"
          protocol_identity="$(sha256sum shared/schemas/ainative/v1/gameplay.proto | cut -d ' ' -f 1)"
          docker build \
            --platform linux/amd64 \
            --file infrastructure/runtime-acceptance/Dockerfile \
            --build-arg "SDK_IMAGE=${{ steps.images.outputs.sdk_image }}" \
            --build-arg "RUNTIME_IMAGE=${{ steps.images.outputs.runtime_image }}" \
            --build-arg "SOURCE_COMMIT=$CANDIDATE_SOURCE_COMMIT" \
            --build-arg "FANTASY_COMMIT=$fantasy_commit" \
            --build-arg "PROTOCOL_IDENTITY=$protocol_identity" \
            --tag ainative/battle-host:acceptance \
            .

      - name: Probe candidate image identity, readiness, drain, and SIGTERM
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach \
            --publish 127.0.0.1:5081:8080 \
            --env AINATIVE_ENABLE_EVALUATION_ENDPOINTS=true \
            --env AINATIVE_REPLAY_CAPTURE_PATH=/tmp/battle.anrp \
            --env OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4317 \
            ainative/battle-host:acceptance)"
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          deadline=$((SECONDS + 30))
          until curl --fail --silent http://127.0.0.1:5081/health/ready >/dev/null; do
            if ! docker inspect --format '{{.State.Running}}' "$container_id" | grep -q true || (( SECONDS >= deadline )); then
              docker logs "$container_id"
              exit 1
            fi
            sleep 0.25
          done
          test "$(docker exec "$container_id" id -u)" != '0'
          docker exec "$container_id" sh -c "grep -q '\"tfm\": \"net10.0\"' /app/AiNative.BattleHost.runtimeconfig.json"
          test "$(docker exec "$container_id" sh -c 'find /app -name Fantasy.config -type f | wc -l')" = '1'
          docker exec "$container_id" test -f /app/Fantasy-Net.dll
          docker exec "$container_id" grep -q 'Fantasy-Net/2026.1.1002' /app/AiNative.BattleHost.deps.json
          probe="$(curl --fail --silent --request POST http://127.0.0.1:5081/admin/kcp-loopback)"
          test "$(jq -r '.status' <<<"$probe")" = 'ok'
          test "$(jq -r '.reconnectedEpoch > .initialConnectionEpoch' <<<"$probe")" = 'true'
          curl --fail --silent --request POST http://127.0.0.1:5081/admin/drain >/dev/null
          readiness_deadline=$((SECONDS + 2))
          until test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5081/health/ready)" = '503'; do
            if (( SECONDS >= readiness_deadline )); then
              docker logs "$container_id"
              exit 1
            fi
            sleep 0.05
          done
          docker stop --signal TERM --time 10 "$container_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = '0'
          docker cp "$container_id:/tmp/battle.anrp" "$GITHUB_WORKSPACE/artifacts/runtime-acceptance/image-battle.anrp"
          replay="$(dotnet "$GITHUB_WORKSPACE/artifacts/battle-host/AiNative.BattleHost.dll" --verify-replay "$GITHUB_WORKSPACE/artifacts/runtime-acceptance/image-battle.anrp")"
          test "$(jq -r '.InputCount' <<<"$replay")" = '1'
          test "$(jq -r '.SourceCommit' <<<"$replay")" = "$CANDIDATE_SOURCE_COMMIT"
          test "$(jq -r '.FantasyCommit' <<<"$replay")" = "$(git -C server/vendor/Fantasy rev-parse HEAD)"

          first_container_id="$container_id"
          container_id="$(docker run --detach \
            --publish 127.0.0.1:5081:8080 \
            --env AINATIVE_ENABLE_EVALUATION_ENDPOINTS=true \
            --env AINATIVE_REPLAY_CAPTURE_PATH=/tmp/load.anrp \
            --env AINATIVE_ACCEPTANCE_REPORT_PATH=/tmp/load-report.json \
            --env AINATIVE_ACCEPTANCE_WARMUP_TICKS=60 \
            ainative/battle-host:acceptance)"
          deadline=$((SECONDS + 30))
          until curl --fail --silent http://127.0.0.1:5081/health/ready >/dev/null; do
            if ! docker inspect --format '{{.State.Running}}' "$container_id" | grep -q true || (( SECONDS >= deadline )); then
              docker logs "$container_id"
              exit 1
            fi
            sleep 0.25
          done
          load="$(curl --fail --silent --request POST 'http://127.0.0.1:5081/admin/kcp-load?botCount=64&durationSeconds=5')"
          test "$(jq -r '.botCount' <<<"$load")" = '64'
          test "$(jq -r '.peakConnections' <<<"$load")" = '64'
          test "$(jq -r '.inputFrames > 1000' <<<"$load")" = 'true'
          test "$(jq -r '.snapshotFrames > 0' <<<"$load")" = 'true'
          docker stop --signal TERM --time 10 "$container_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = '0'
          docker cp "$container_id:/tmp/load.anrp" "$GITHUB_WORKSPACE/artifacts/runtime-acceptance/image-load.anrp"
          docker cp "$container_id:/tmp/load-report.json" "$GITHUB_WORKSPACE/artifacts/runtime-acceptance/image-load-report.json"
          replay="$(dotnet "$GITHUB_WORKSPACE/artifacts/battle-host/AiNative.BattleHost.dll" --verify-replay "$GITHUB_WORKSPACE/artifacts/runtime-acceptance/image-load.anrp")"
          test "$(jq -r '.InputCount > 1000' <<<"$replay")" = 'true'
          test "$(jq -r '.gameplayAllocatedBytes' "$GITHUB_WORKSPACE/artifacts/runtime-acceptance/image-load-report.json")" = '0'
          test "$(jq -r '.tickP99Milliseconds <= 16.67' "$GITHUB_WORKSPACE/artifacts/runtime-acceptance/image-load-report.json")" = 'true'
          docker rm "$first_container_id" >/dev/null

      - name: Record candidate image provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime-acceptance
          image_id="$(docker image inspect ainative/battle-host:acceptance --format '{{.Id}}')"
          cat > artifacts/runtime-acceptance/provenance.json <<JSON
          {
            "parentCommit": "$CANDIDATE_SOURCE_COMMIT",
            "fantasyCommit": "$(git -C server/vendor/Fantasy rev-parse HEAD)",
            "sdkImage": "${{ steps.images.outputs.sdk_image }}",
            "runtimeImage": "${{ steps.images.outputs.runtime_image }}",
            "candidateImageId": "$image_id",
            "protocolSha256": "$(sha256sum shared/schemas/ainative/v1/gameplay.proto | cut -d ' ' -f 1)"
          }
          JSON

      - name: Upload candidate provenance
        uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance-provenance
          path: artifacts/runtime-acceptance/provenance.json
          if-no-files-found: error

      - name: Upload impairment and production replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance-evidence
          path: |
            artifacts/runtime-acceptance/regional.json
            artifacts/runtime-acceptance/degraded.json
            artifacts/runtime-acceptance/backpressure.json
            artifacts/runtime-acceptance/direct-battle.anrp
            artifacts/runtime-acceptance/direct-load.anrp
            artifacts/runtime-acceptance/direct-load-report.json
            artifacts/runtime-acceptance/image-battle.anrp
            artifacts/runtime-acceptance/image-load.anrp
            artifacts/runtime-acceptance/image-load-report.json
          if-no-files-found: error

      - name: Run labeled 60-minute release-equivalent 64-bot soak
        if: contains(github.event.pull_request.labels.*.name, 'qualified-soak')
        shell: bash
        run: |
          set -euo pipefail
          soak_container="$(docker run --detach \
            --publish 127.0.0.1:5082:8080 \
            --env AINATIVE_ENABLE_EVALUATION_ENDPOINTS=true \
            --env AINATIVE_ACCEPTANCE_REPORT_PATH=/tmp/soak-report.json \
            --env AINATIVE_ACCEPTANCE_WARMUP_TICKS=600 \
            --env AINATIVE_ACCEPTANCE_MAX_TICKS=230000 \
            ainative/battle-host:acceptance)"
          cleanup_soak() { docker rm --force "$soak_container" >/dev/null 2>&1 || true; }
          trap cleanup_soak EXIT
          deadline=$((SECONDS + 30))
          until curl --fail --silent http://127.0.0.1:5082/health/ready >/dev/null; do
            if ! docker inspect --format '{{.State.Running}}' "$soak_container" | grep -q true || (( SECONDS >= deadline )); then
              docker logs "$soak_container"
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent --max-time 3700 --request POST \
            'http://127.0.0.1:5082/admin/kcp-load?botCount=64&durationSeconds=3600' \
            > "$GITHUB_WORKSPACE/artifacts/runtime-acceptance/soak-load.json"
          docker stop --signal TERM --time 30 "$soak_container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$soak_container")" = '0'
          docker cp "$soak_container:/tmp/soak-report.json" \
            "$GITHUB_WORKSPACE/artifacts/runtime-acceptance/soak-host.json"
          load="$GITHUB_WORKSPACE/artifacts/runtime-acceptance/soak-load.json"
          report="$GITHUB_WORKSPACE/artifacts/runtime-acceptance/soak-host.json"
          test "$(jq -r '.botCount' "$load")" = '64'
          test "$(jq -r '.peakConnections' "$load")" = '64'
          test "$(jq -r '.elapsedSeconds >= 3600' "$load")" = 'true'
          test "$(jq -r '.inputFrames > 10000000' "$load")" = 'true'
          test "$(jq -r '.snapshotFrames > 1000000' "$load")" = 'true'
          test "$(jq -r '.sampleCount >= 215000' "$report")" = 'true'
          test "$(jq -r '.elapsedSeconds >= 3600' "$report")" = 'true'
          test "$(jq -r '.tickP99Milliseconds <= 16.67' "$report")" = 'true'
          test "$(jq -r '.tickP999Milliseconds <= 20' "$report")" = 'true'
          test "$(jq -r '.slowTickPercentage <= 0.1' "$report")" = 'true'
          test "$(jq -r '.gameplayP99Milliseconds <= 8' "$report")" = 'true'
          test "$(jq -r '.gameplayAllocatedBytes' "$report")" = '0'
          test "$(jq -r '.sourceCommit' "$report")" = "$CANDIDATE_SOURCE_COMMIT"

      - name: Upload qualified-duration soak evidence
        if: contains(github.event.pull_request.labels.*.name, 'qualified-soak')
        uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance-soak
          path: |
            artifacts/runtime-acceptance/soak-load.json
            artifacts/runtime-acceptance/soak-host.json
          if-no-files-found: error
